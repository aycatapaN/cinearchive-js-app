<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineArchive | Film & Dizi Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5 header-animate">
            <h2 class="fw-bold text-white"><i class="fa-solid fa-clapperboard text-warning me-3"></i>CineArchive</h2>
            <div class="badge premium-badge px-3 py-2 rounded-pill shadow-sm">
                <i class="fa-solid fa-star text-warning me-1"></i> Arşiv Paneli
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card panel-card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4 text-white">Yeni Yapım Ekle</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Yapım Adı</label>
                            <input type="text" id="mediaName" class="form-control form-control-lg custom-input" placeholder="Örn: The Matrix">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Tür</label>
                            <select id="mediaType" class="form-select form-select-lg custom-input">
                                <option value="Film">🎬 Film</option>
                                <option value="Dizi">📺 Dizi</option>
                                <option value="Belgesel">🌍 Belgesel</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-semibold">Kategori</label>
                            <select id="mediaGenre" class="form-select form-select-lg custom-input">
                                <option value="Bilim Kurgu">Bilim Kurgu</option>
                                <option value="Aksiyon">Aksiyon</option>
                                <option value="Dram">Dram</option>
                                <option value="Komedi">Komedi</option>
                                <option value="Gerilim">Gerilim</option>
                                <option value="Animasyon">Animasyon</option>
                                <option value="Belgesel">Belgesel</option>
                            </select>
                        </div>
                        <button onclick="addMedia()" class="btn btn-warning btn-lg w-100 rounded-3 shadow fw-bold text-dark">
                            <i class="fa-solid fa-plus me-2"></i>Arşive Ekle
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card panel-card border-0 shadow-lg rounded-4 h-100">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4 text-white d-flex justify-content-between">
                            Koleksiyonum
                            <span class="badge bg-secondary rounded-pill" id="totalCount">0 Yapım</span>
                        </h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle custom-table">
                                <thead>
                                    <tr>
                                        <th>İsim</th>
                                        <th>Tür</th>
                                        <th>Kategori</th>
                                        <th class="text-end">İşlemler</th>
                                    </tr>
                                </thead>
                                <tbody id="mediaList">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
